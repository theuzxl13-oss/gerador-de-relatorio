# Blueprint do Render (https://render.com/docs/blueprint-spec)
# Cria o serviço web gratuito. O banco de dados é externo (Neon – PostgreSQL
# gratuito que não expira): informe a DATABASE_URL quando o Render pedir.
services:
  - type: web
    name: fazenda-da-ilha-ocorrencias
    runtime: node
    plan: free
    # Mesma região do banco Neon recomendado (AWS US East – N. Virginia) para menor latência
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: America/Sao_Paulo
      - key: DATABASE_URL
        sync: false
      # Admin Geral inicial: usado só enquanto não existe usuário; senha forte (12+) e provisória
      - key: APP_USUARIO
        sync: false
      - key: APP_SENHA
        sync: false
      # TLS do banco: padrão "verificar" (Neon usa certificado público). Para Supabase,
      # adicione manualmente DATABASE_CA_CERT com o certificado do painel do Supabase.
      # Chave que assina os logins (sessões). Gerada automaticamente pelo Render.
      - key: SESSAO_SEGREDO
        generateValue: true
      # Opcional, com Cloudflare: o mesmo valor do cabeçalho x-origem-segredo
      # criado na Cloudflare (veja README → Segurança). Bloqueia o acesso direto ao *.onrender.com.
      - key: ORIGEM_SEGREDO
        sync: false
      # Produção: começa sem dados de demonstração e sem o botão que apaga tudo
      - key: SEED_DEMO
        value: "false"
      - key: PERMITIR_RESTAURAR_DEMO
        value: "false"
