name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: America/Sao_Paulo
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (reproduzível)
        run: npm ci

      - name: Verificar tipos (lint)
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Testes de integração (PostgreSQL de teste)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run test:integracao

      - name: Build de produção
        run: npm run build

      - name: Testes ponta a ponta (permissões, sessões, anexos)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e
          APP_USUARIO: admin.e2e
          APP_SENHA: Senha-Inicial-E2E-2026
          PORT: "3100"
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "create database e2e"
          export SESSAO_SEGREDO="$(openssl rand -base64 32)"
          npx next start -p 3100 > servidor.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3100/api/saude && break; sleep 2; done
          E2E_BASE_URL=http://localhost:3100 npm run test:e2e

      - name: Log do servidor (em caso de falha)
        if: failure()
        run: cat servidor.log || true
